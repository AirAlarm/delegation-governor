[project]
name = "delegation-governor"
version = "0.3.0"
description = "Multi-endpoint task orchestration for Claude Code: Codex, local Station, and OpenCode Go workers."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dg = "dg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# worker/ vendors dg-worker's own source (a fork of cc-delegate) with its own
# separate test suite and dependency set (litellm, deepagents, ...) that this
# project's own env doesn't install -- run it from worker/ directly instead.
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/dg"]
